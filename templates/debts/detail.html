{% extends "base.html" %}
{% block title %}Задолженность {{ debt.id }}{% endblock %}
{% block content %}
<h1>Задолженность {{ debt.id }}</h1>
<p><a href="{% url 'student_detail' debt.student.id %}">{{ debt.student.name }}</a></p>
<p>{{ debt.discipline.name }}</p>
<p>{{ debt.date_created }}</p>
<p>{{ status }}</p>
<a href="{% url 'debts' %}" class="back">Список задолженностей</a>
{% endblock %}
