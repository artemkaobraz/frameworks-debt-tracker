<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}DebtTrack{% endblock %}</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; color: #222; background: #fff; font: 16px/1.5 Arial, sans-serif; }
        header { border-bottom: 1px solid #ddd; }
        header div, main { width: min(100% - 32px, 760px); margin: 0 auto; }
        header div { display: flex; align-items: center; gap: 24px; min-height: 64px; }
        nav { display: flex; flex-wrap: wrap; gap: 16px; }
        main { padding: 40px 0; }
        h1, h2 { line-height: 1.2; }
        h1 { margin: 0 0 24px; }
        h2 { margin-top: 32px; font-size: 20px; }
        a { color: #2457a6; }
        header a { color: #222; text-decoration: none; }
        .brand { font-weight: bold; }
        .actions { display: flex; flex-wrap: wrap; gap: 10px; }
        .button { display: inline-block; padding: 8px 12px; color: #2457a6; border: 1px solid #2457a6; border-radius: 4px; text-decoration: none; }
        .list { margin: 0; padding: 0; list-style: none; }
        .list li { padding: 12px 0; border-bottom: 1px solid #ddd; }
        .muted { color: #666; }
        .error { color: #8b2525; }
        .back { display: inline-block; margin-top: 24px; }
        @media (max-width: 560px) {
            header div { align-items: flex-start; flex-direction: column; gap: 8px; padding: 14px 0; }
        }
    </style>
</head>
<body>
<header>
    <div>
        <a class="brand" href="{% url 'index' %}">DebtTrack</a>
        <nav>
            <a href="{% url 'students' %}">Студенты</a>
            <a href="{% url 'debts' %}">Задолженности</a>
            <a href="{% url 'disciplines' %}">Дисциплины</a>
        </nav>
    </div>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
