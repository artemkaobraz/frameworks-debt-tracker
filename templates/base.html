{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}DebtTrack{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'homepage/css/style.css' %}">
</head>
<body>
<header>
    <div class="header-content">
        <h1 class="site-brand">
            <a href="{% url 'homepage:index' %}">DebtTrack</a>
        </h1>
        {% include "includes/navigation.html" %}
    </div>
</header>
<main>{% block content %}{% endblock %}</main>
<footer>
    <p>© <span id="current-year"></span> DebtTrack</p>
</footer>
<script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
